server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/articles {
        proxy_pass http://article-service:8080;
        proxy_http_version 1.1;
    }

    location /api/comments {
        proxy_pass http://comment-service:8080;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri /index.html;
    }
}
