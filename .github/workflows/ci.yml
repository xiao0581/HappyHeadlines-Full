
name: HappyHeadlines CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - article-service
          - comment-service
          - web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/xiao0581/happyheadlines-${{ matrix.service }}:v1.${{ github.run_number }}
            ghcr.io/xiao0581/happyheadlines-${{ matrix.service }}:sha-${{ github.sha }}
