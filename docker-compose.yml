
services:
  # Article Database
  article-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: articles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - article-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d articles"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Comment Database
  comment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Subscriber Database
  subscriber-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: subscribers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - subscriber-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscribers"]
      interval: 5s
      timeout: 3s
      retries: 20

  # RabbitMQ
  subscriber-queue:
    image: rabbitmq:3-management
    hostname: subscriber-queue
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: subscriber
      RABBITMQ_DEFAULT_PASS: subscriber-dev-password
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - subscriber-queue-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # FeatureHub
  featurehub:
    image: featurehub/party-server:latest
    user: "999:999"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - featurehub-data:/db

  # Article Cache
  article-cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - article-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Comment Cache
  comment-cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - comment-cache-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Article Service
  article-service:
    build:
      context: ./apps/article-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ArticleDb: Host=article-db;Port=5432;Database=articles;Username=postgres;Password=postgres
      Redis__ConnectionString: article-cache:6379
      Cache__RefreshSeconds: 30
      Cache__TtlSeconds: 120
      Cache__RecentDays: 14
    ports:
      - "5001:8080"
    depends_on:
      article-db:
        condition: service_healthy
      article-cache:
        condition: service_healthy

  # Comment Service
  comment-service:
    build:
      context: ./apps/comment-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CommentDb: Host=comment-db;Port=5432;Database=comments;Username=postgres;Password=postgres
      Redis__ConnectionString: comment-cache:6379
      Cache__MaxArticles: 30
    ports:
      - "5002:8080"
    depends_on:
      comment-db:
        condition: service_healthy
      comment-cache:
        condition: service_healthy

  # Subscriber Service + FeatureHub
  subscriber-service:
    build:
      context: ./apps/subscriber-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SubscriberDb: Host=subscriber-db;Port=5432;Database=subscribers;Username=postgres;Password=postgres

      RabbitMq__Host: subscriber-queue
      RabbitMq__Username: subscriber
      RabbitMq__Password: subscriber-dev-password

      FEATUREHUB_EDGE_URL: http://featurehub:8085
      FEATUREHUB_API_KEY: ${FEATUREHUB_API_KEY:?Set FEATUREHUB_API_KEY first}

    ports:
      - "5003:8080"

    depends_on:
      subscriber-db:
        condition: service_healthy
      subscriber-queue:
        condition: service_healthy
      featurehub:
        condition: service_started

  # Newsletter Service
  newsletter-service:
    build:
      context: ./apps/newsletter-service
    restart: unless-stopped
    environment:
      RabbitMq__Host: subscriber-queue
      RabbitMq__Username: subscriber
      RabbitMq__Password: subscriber-dev-password
    depends_on:
      subscriber-queue:
        condition: service_healthy

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - article-service
      - comment-service

  # Grafana
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Web Frontend
  web:
    build:
      context: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      - article-service
      - comment-service

volumes:
  article-db-data:
  comment-db-data:
  subscriber-db-data:
  subscriber-queue-data:
  featurehub-data:
  article-cache-data:
  comment-cache-data:
  prometheus-data:
  grafana-data:
